# Seyra PREPARATION compose (preparation environment only; may use the Internet).
# Builds every Seyra image from pinned sources fetched by infra/prepare/fetch-sources.sh.
# The operational environment never uses this file.
#   SEYRA_SOURCES=/path/to/sources docker compose -f infra/compose/prepare.yml build
name: seyra-prepare


services:
  osmtools:
    image: "seyra/osmtools:2.3.1-1.19.1-seyra1"
    build:
      context: ../
      dockerfile: images/osmtools/Dockerfile
      additional_contexts:
        osm2pgsql_src: "${SEYRA_SOURCES:?}/osm2pgsql"
        osmium_tool_src: "${SEYRA_SOURCES:?}/osmium-tool"
  valhalla:
    image: "seyra/valhalla:3.9.1-seyra1"
    build:
      context: ../images/valhalla
      additional_contexts:
        valhalla_src: "${SEYRA_SOURCES:?}/valhalla"
        prime_server_src: "${SEYRA_SOURCES:?}/prime_server"
  overpass:
    image: "seyra/overpass:0.7.62.4-seyra1"
    build:
      context: ../images/overpass
      additional_contexts:
        overpass_src: "${SEYRA_SOURCES:?}/overpass"
  tegola:
    image: "seyra/tegola:0.21.2-seyra1"
    build:
      context: ../images/tegola
      args:
        TEGOLA_REVISION: a803ac9b084c2a9a32ff9c6fb0a7ee9ba30c7e8f
      additional_contexts:
        tegola_src: "${SEYRA_SOURCES:?}/tegola"
  photon:
    image: "seyra/photon:1.3.0-seyra1"
    build:
      context: ../images/photon
      additional_contexts:
        photon_artifacts: "${SEYRA_SOURCES:?}/artifacts"
        photon_src: "${SEYRA_SOURCES:?}/photon"
  geocoder-build:
    image: "seyra/geocoder-build:5.3.2-1.3.0-seyra1"
    build:
      context: ../images/geocoder-build
      additional_contexts:
        nominatim_artifacts: "${SEYRA_SOURCES:?}/artifacts"
  api:
    image: "seyra/api:1.0.0-seyra1"
    build:
      context: ../../
      dockerfile: infra/images/api/Dockerfile
      secrets: [prep_ca]
  proxy:
    image: "seyra/proxy:1.0.0-seyra1"
    build:
      context: ../../
      dockerfile: infra/images/proxy/Dockerfile
      secrets: [prep_ca]
  ops:
    image: "seyra/ops:1.0.0-seyra1"
    build:
      context: ../../
      dockerfile: infra/images/ops/Dockerfile
      secrets: [prep_ca]

secrets:
  prep_ca:
    file: "${SEYRA_PREP_CA:-/dev/null}"
